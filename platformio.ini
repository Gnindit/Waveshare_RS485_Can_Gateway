; PlatformIO Project Configuration File
;
; This project reads Modbus RTU data over RS485 on an ESP32-S3.

[platformio]
default_envs = esp32-s3-main
extra_configs = platformio.local.ini

[env:esp32-s3-main]
platform = espressif32 @ 7.0.1
board = esp32-s3-devkitc1-n16r8
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = partitions/app3M_fat9M_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

; Modbus RTU master library
lib_deps =
  4-20ma/ModbusMaster @ ^2.0.1

; Public OTA artifacts reuse credentials provisioned in NVS; never embed wifi_secrets.h.
[env:esp32-s3-release]
extends = env:esp32-s3-main
build_flags =
  ${env:esp32-s3-main.build_flags}
  -D GATEWAY_PUBLIC_RELEASE=1
